name: Build

on:
  workflow_call:
    inputs:
      library-name:
        required: true
        type: string
      python-version:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: "Build (Moon)"
    permissions:
      attestations: write # Write attestation for uploaded distribution artifacts
      contents: read # Read the source code of the project
      id-token: write # Write access to a temporary token for signing attestations
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
          activate-environment: true

      - name: Setup Moon Toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - name: Build (Moon)
        shell: bash
        env:
          PACKAGE: ${{ inputs.library-name }}
          MOON_TOOLCHAIN_FORCE_GLOBALS: 'uv'
        run: moon run $PACKAGE:build

      - name: Twine check (Moon)
        shell: bash
        env:
          PACKAGE: ${{ inputs.library-name }}
          MOON_TOOLCHAIN_FORCE_GLOBALS: 'uv'
        run: moon run $PACKAGE:twine-check

      - name: "Upload distribution artifacts to GitHub artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.library-name }}-${{ inputs.python-version }}-artifacts
          path: dist/
          retention-days: 7

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
            subject-path: dist/

      - name: Check if wheel can be pip installed
        uses: ansys/saf-devops/pip-install-production-wheel@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          wheel-artifact: '${{ inputs.library-name }}-artifacts'
