name: 🐞 Bug
description: Fill a bug report here
title: "Bug located in ..."
type: "Bug"
labels: ["triage"]
assignees: [""]

body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Warning
        **Please do not share:**
        - Sensitive customer information or data
        - Links to Ansys/Synopsys or any internal websites
        - Confidential or proprietary information

        This is a public repository and all information submitted will be visible to everyone.

  - type: textarea
    id: bug-description
    attributes:
      label: '🐞 Description of the bug'
      placeholder: Describe what bug you encountered and what should have happened.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: '📝 Steps to reproduce'
      placeholder: Please write the steps to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: installed-packages
    attributes:
      label: '📦 Installed packages and configuration'
      description: Describe the configuration (OS and packages that are being used)
      placeholder: "Example : OS, package-lock.json..."
    validations:
      required: true

  - type: input
    id: support-ticket-ID
    attributes:
      label: '📦 Support ticket ID'
      description: Give the CRM ticket ID if it's not an internal defect.
      placeholder:
    validations:
      required: false

  - type: input
    id: found-in
    attributes:
      label: '🐞 Found in'
      description: Give the version number the bug has been found.
      placeholder:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash reports
      description: |
        📄 **Attach your log files here** — you can drag and drop `.log`, `.txt`, or `.zip` files into this text area.
      placeholder: |
        Paste log text here or drag and drop log files:
    validations:
      required: true

  - type: input
    id: fixed-in
    attributes:
      label: '🩹 Fixed in'
      description: Give the version number the bug has been fixed.
      placeholder:
    validations:
      required: false

  - type: textarea
    id: root-cause
    attributes:
      label: 'Root cause'
      description: Provide the cause of the bug.
      placeholder:
    validations:
      required: false

  - type: checkboxes
    id: third-party
    attributes:
      label: Third Party
      description:
      options:
        - label: This bug is introduced by a third party

  - type: checkboxes
    id: bug-released
    attributes:
      label: Released Bug
      description:
      options:
        - label: This bug is in a released product
