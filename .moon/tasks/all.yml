tasks:
  pre-commit:
    command: 'uv run pre-commit run --files $MOON_AFFECTED_FILES'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - '/.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'

  build:
    description: "Build wheel"
    command:
      - "uv"
      - "build"
      - "--package"
      - "$projectAlias"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
      - "/.python-version"
    outputs:
      - "/dist"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  format:
    description: "Run ruff format"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "format"
      - "--diff"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/.python-version"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  format-fix:
    description: "Fix ruff format"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "format"
      - "$projectSource"
    options:
      runFromWorkspaceRoot: true
    preset: "utility"

  bandit:
    description: "Run bandit"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "bandit"
      - "-r"
      - "$projectSource/src"
      - "--severity-level=high"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/.python-version"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  install-dependency:
    description: "Install a runtime-only package"
    command:
      - "uv"
      - "pip"
      - "install"
    options:
      cache: false
      runFromWorkspaceRoot: true
    preset: "utility"

  test:
    command: 'noop'
    deps:
      - '~:pytest-windows'
      - '~:pytest-linux'

  pytest-windows:
    description: "Run pytest on Windows"
    command: 'uv'
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pytest"
      - "-p"
      - "no:faulthandler"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
    options:
      os: 'windows'
    env:
      PYTEST_DEBUG_TEMPROOT: 'C:/'
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/.python-version"

  pytest-linux:
    description: "Run pytest on Linux"
    command: 'uv'
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pytest"
      - "-p"
      - "no:faulthandler"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
    options:
      os: 'linux'
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/.python-version"
