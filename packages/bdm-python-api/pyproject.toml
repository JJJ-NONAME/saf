[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0" ]

[tool.poetry]
name = "ansys-bdm-api"
version = "0.6.dev0"
description = "Python API for BDM"
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
packages = [
  { include = "ansys", from = "src" },
  { include = "ansys/bdm/api/py.typed", from = "src" },
  { include = "ansys/bdm/api", from = "src" },
]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
pydantic = "^2.3.0"
anyio = ">=3.7.1,<5.0.0"
aioshutil = "^1.3"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { extras = [ "autoapi" ], version = "^1.7.0", python = ">=3.12" }
autodoc-pydantic = { version = "^2.2.0", python = ">=3.12" }
numpydoc = { version = "^1.10.0", python = ">=3.12" }
sphinx = { version = "^9.1.0", python = ">=3.12" }
sphinx-autodoc-typehints = { version = "^3.6.3", python = ">=3.12" }
sphinx-copybutton = { version = "^0.5.2", python = ">=3.12" }
sphinx-design = { version = "^0.7.0", python = ">=3.12" }
tox = { version = "^4.38.0", python = ">=3.12" }

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
coverage = "^6.4.1"
filelock = "^3.8.0"
mock = "^4.0.3"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^4.0.0"
pytest-html = "^4.1.1"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "conf.py",
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "FAST",   # fastapi
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "TC",     # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "PYI034" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.coverage.run]
source = [ "ansys.bdm" ]
omit = [
  "read_toml.py",
  "tests/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = [ "src" ]
include = [
  "src/ansys/bdm/api",
  "tests",
]
strict = [
  "src/ansys/bdm/api",
  "tests",
]

[tool.bandit]
exclude_dirs = [ ".venv", ".tox", "tests" ]

[build-system-requirements]
build-system-version = "2.3.2"
