repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0470f7c8a653e950f7cc5a653204ceb3fde4c02a # v0.15.0
    hooks:
      - id: ruff-check
        files: ^packages/glow-engine/
        args: [--fix]
      - id: ruff-format
        files: ^packages/glow-engine/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 81b795a41ddcc3c77218d8c8e406983e39852285 # v1.1.408
    hooks:
      - id: pyright
        files: ^packages/glow-engine/
        args: [--project, packages/glow-engine, --venvpath, packages/glow-engine]
        exclude: ^packages/glow-engine/doc/source/conf.py$

  - repo: https://github.com/python-poetry/poetry
    rev: a84cd0f1bedb5769ef6ef7389d8ee99b93b9ba4c # frozen: v2.3.2
    hooks:
      - id: poetry-check
        entry: poetry -C packages/glow-engine check

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # v1.9.4
    hooks:
      - id: bandit
        args: ["-c", "packages/glow-engine/pyproject.toml", "--severity-level", "high",
          "-r", "src"]
        additional_dependencies: ["bandit[toml]"]

