ci:
  autofix_commit_msg: |
    chore: auto fixes from pre-commit.com hooks

    For more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: 'chore/pre-commit-autoupdate'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: weekly

repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0470f7c8a653e950f7cc5a653204ceb3fde4c02a # v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^packages/saf-templates/src/ansys/saf/templates/steps/
      - id: ruff-format
        files: ^packages/saf-templates/
        exclude: ^packages/saf-templates/src/ansys/saf/templates/steps/

  # NOTE: Ruff does not check for python code in some part of the documentation,
  # e.g. python code block, ..., see https://github.com/astral-sh/ruff/issues/8237
  - repo: https://github.com/adamchainz/blacken-docs
    rev: fda77690955e9b63c6687d8806bafd56a526e45f # 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==25.1.0]
        args: ["--line-length=120"]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 69b77b8d2436cb00c886f129dda7f68f3b2909ac # v2.11.0
    hooks:
      - id: pyproject-fmt
        files: ^packages/saf-templates/pyproject\.toml$
        args: [--keep-full-version]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 81b795a41ddcc3c77218d8c8e406983e39852285 # frozen: v1.1.408
    hooks:
      - id: pyright
        files: ^packages/saf-templates/
        args: [--project, packages/saf-templates, --venvpath, packages/saf-templates]
        exclude: ^packages/saf-templates/doc/source/conf.py$
