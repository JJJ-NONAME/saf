[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0,<3.0.0" ]

[tool.poetry]
name = "ansys-saf-testing"
version = "0.15.dev0"
description = "Collection of test utilities for the Solution Application Framework."
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/testing/"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
click = "^8.1.7"
cryptography = "^50.0.0"
httpx2 = "^2.5.0"
psutil = "^7.0"
pydantic = "^2.7"
pytest = "~9.0.3"                                                                                         # Limited to <9.1.0 because higher versions produce a BDM error
pytest-mock = "^3.15.0"
pyyaml = "^6.0.0"
tenacity = "^8.2.3"                                                                                       # has to be <9.0.0 to be compatible with ansys-conceptev-core 0.9.4
typing-extensions = "^4.14.0"
selenium = { version = "^4.0", optional = true }                                                          # for testing web frontends
docker = { version = "^7.1.0", optional = true }
ansys-hps-client = { version = ">=0.12, <1.0", optional = true }
ansys-saf-product-configuration = { version = ">=0.20, <1.0", allow-prereleases = true, optional = true } # for HPS and PIM Light Server
grpcio = { version = "^1.47.0", optional = true }                                                         # for PIM Light Server
grpcio-health-checking = { version = "^1.24.0", optional = true }                                         # for PIM Light Server

[tool.poetry.extras]
selenium = [ "selenium" ]
hps = [ "ansys-hps-client", "ansys-saf-product-configuration", "docker" ]
docker = [ "docker" ]
pim = [ "grpcio", "grpcio-health-checking", "ansys-saf-product-configuration" ]
# didn't find a way to dynamically include previous groups, so we need to copy all dependencies
all = [
  "selenium",
  "ansys-hps-client",
  "ansys-saf-product-configuration",
  "docker",
  "grpcio",
  "grpcio-health-checking",
]

[tool.poetry.group.style]
optional = true
[tool.poetry.group.style.dependencies]
black = "^26.3.1"
codespell = "^2.2.4"
pyright = "^1.1.318"
ruff = ">= 0.0.287, < 1.0.0"
ruff-lsp = "^0.0"
pre-commit = "^4.2.0"

[tool.poetry.group.tests.dependencies]
pytest-cov = "^7.0.0"
pytest-html = "^4.1.1"
pytest-md = "^0.2.0"
pytest-rerunfailures = "^16.1.0"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { extras = [ "autoapi" ], version = "^1.7.0" }
autodoc_pydantic = "^2.0"
numpydoc = "^1.6.0"
sphinx = "^8.0"
sphinx-code-tabs = "^0.5.5"
sphinx-design = "^0.6.1"
sphinx-autobuild = "^2021.3.14"
sphinx-autodoc-typehints = "^2.5.0"
sphinxcontrib-websupport = "^1.2.4"
sphinx-copybutton = "^0.5.2"
sphinxemoji = "^0.2"
sphinx-gallery = "^0.15"
sphinx-notfound-page = "^0.8.3"
sphinx-tabs = ">=1.2.1,<3.5.0"
toml = "^0.10.2"
tox = "^4.38.0"

[tool.poetry.plugins.pytest11]
# By registering the plugins here, they can be used without needing to declare them in pytest_plugins.
# https://docs.pytest.org/en/stable/how-to/writing_plugins.html#making-your-plugin-installable-by-others
saf_testing_directories = "ansys.saf.testing.directories"
saf_testing_common = "ansys.saf.testing.common"
saf_testing_docstring = "ansys.saf.testing.docstring_with_test_case"
saf_testing_mocking = "ansys.saf.testing.mocking"
saf_testing_network = "ansys.saf.testing.network"
saf_testing_selenium = "ansys.saf.testing.selenium"
saf_testing_platform_specific = "ansys.saf.testing.platform_specific"
saf_testing_process = "ansys.saf.testing.process"
saf_testing_solution = "ansys.saf.testing.solution"
saf_testing_pytest = "ansys.saf.testing.pytest"
saf_testing_docker = "ansys.saf.testing.docker"
saf_testing_hps = "ansys.saf.testing.hps"
saf_testing_pim = "ansys.saf.testing.pim"
saf_testing_database = "ansys.saf.testing.database"
saf_testing_solution_e2e = "ansys.saf.testing.solution.end_to_end"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "*_pb2.py",
  "*_pb2_grpc.py",
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [
  "COM812", # conflicts with ruff formatter
  "PTH207",
]
lint.flake8-bugbear.extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.params.Depends",
  "fastapi.params.Form",
  "fastapi.params.Query",
  "fastapi.Query",
]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "tests" ]

[tool.codespell]
ignore-words = ".codespellignore"
skip = "*.log,*.json,.git,.venv,.poetry,*.lcov,htmlcov,dist,./reports/*,poetry.lock,./doc/build/*"

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
testpaths = [ "tests" ]
filterwarnings = [
  "ignore:Accessing the 'model_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class:DeprecationWarning",
  "ignore:Accessing the 'model_computed_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class:DeprecationWarning",
]

[tool.coverage.run]
source = [ "ansys.saf.testing" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [ "src" ]
include = [ "src/ansys/saf/testing", "tests" ]
exclude = [
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
  ".venv",
  ".poetry",
  "doc/**",
]
strict = [ "src/ansys/saf/testing", "tests" ]
venvPath = "."
venv = ".venv"

[build-system-requirements]
build-system-version = "2.3.2"

[tool.bandit]
exclude_dirs = [ "tests", ".github/scripts/pre_commit_exec.py" ]

[tool.copyright]
exclude = [
  "doc/*",
  "tests/*",
  ".github/*",
]
