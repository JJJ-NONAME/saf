[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-saf-cli"
version = "4.3.1"
description = "Command line interface for developing SAF solutions from scaffolding to packaging."
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
keywords = [
  "solution application framework",
  "python",
  "saf",
  "solution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/cli"
from = "src"

[tool.poetry.scripts]
saf = "ansys.saf.cli._cli.main:entry_point"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
python-dotenv = "^1.0.0"
click = "^8.1.7"
pydantic = "^2.7"
chardet = ">=5.2.0,<7"                                                          # chardet 7.0 breaks binaryornot used by cookiecutter
cookiecutter = "^2.6.0"
packaging = "^24.2"
tomlkit = ">=0.14.0,<1.0.0"
ansys-saf-templates = { version = ">=0.2.0, <1.0.0", allow-prereleases = true }

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = "^1.4"
autodoc_pydantic = "^2.0"
numpydoc = "^1.6.0"
sphinx = "^8.0"
sphinx-code-tabs = "^0.5.5"
sphinx-design = "^0.6.1"
sphinx-autobuild = "^2021.3.14"
sphinx-autodoc-typehints = "^2.5.0"
sphinxcontrib-websupport = "^1.2.4"
sphinx-copybutton = "^0.5.2"
sphinxemoji = "^0.2"
sphinx-gallery = "^0.15"
sphinx-notfound-page = "^0.8.3"
sphinx-tabs = ">=1.2.1,<3.5.0"

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
coverage = "^7.0.0"
httpx2 = "^2.5.0"
mock = "^4.0.3"
psutil = "^7.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-html = "^4.1.0"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-order = "^1.1.0"
pytest-rerunfailures = "^15.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
tenacity = "^8.2.3"
ansys-saf-testing = { version = ">=0.13.0, <1.0.0", allow-prereleases = true, extras = [
  "selenium",
  "hps",
] }
# The following packages are included for the linting of the solutions in tests/
ansys-saf-glow-engine = { version = "^2.1", allow-prereleases = true, extras = [
  "dash",
] }
ansys-solutions-dash-super-components = "^1.0.0"
dash_bootstrap_components = "^1.2"
dash-mantine-components = "^2.6.0"
pywinpty = { version = "^3.0.5", platform = "win32" }

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
# TODO: use a tool that makes sure the version here and in the pre-commit file are in sync!
pyright = "1.1.407"
ruff = "0.15.0"
pre-commit = "^4.5"

[tool.black]
line-length = 120
extend-exclude = "({{.*?}})" # Ignore files containing cookiecutter syntax

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "**/_solutions/templates/**", # Ignore files containing cookiecutter syntax
  "conf.py",
  "tests/mocks/plugin/",        # Ignore files containing cookiecutter syntax
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "COM812", "PTH207" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests", "scripts" ]

[tool.codespell]
ignore-words = ".codespellignore"
skip = "./chrome-linux64,./chromedriver-linux64,*.log,*.json,.git,.venv,.poetry,*poetry.lock,*pyproject.toml,*.lcov,htmlcov,dist,./doc/build,*/doc/styles,./my_solution"

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [ "use_session_solution", "use_custom_plugins", "use_hps", "use_pim", "use_minerva" ]
filterwarnings = [  ]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.cli" ]

[tool.coverage.report]
show_missing = true
omit = [
  "*/pytest-of-*/pytest-*/popen-*/*",
  "/tmp/*",
  "*/_solutions/templates/*",
  "*/tests/*",
]

[tool.pyright]
extraPaths = [ "src" ]
include = [ "src/ansys/saf/cli", "tests", "scripts" ]
exclude = [
  ".venv",
  ".poetry",
  ".git",
  "**/_solutions/templates/",                         # Ignore files containing cookiecutter syntax
  "tests/mocks/plugin/",                              # Ignore files containing cookiecutter syntax
  "tests/mocks/pages/first_page_with_minerva.py",
  "tests/mocks/pages/first_page_with_hps.py",
  "tests/mocks/pages/first_page_with_file_output.py",
  "tests/mocks/steps/first_step_with_hps.py",
  "tests/mocks/steps/first_step_with_file_output.py",
  "tests/mocks/steps/first_step_with_minerva.py",
  "tests/unit/mocks/solutions/",
  "doc/source/_static/examples/",
]
strict = [ "src/ansys/saf/cli", "tests", "scripts" ]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.bandit]
exclude_dirs = [ "tests", "setup_environment.py" ]

[build-system-requirements]
build-system-version = "2.3.2"
